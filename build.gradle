plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'be.train.demo'
version = '0.0.1-SNAPSHOT'
description = 'demo'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'eu.europa.ec.joinup.sd-dss:dss-pades-pdfbox:6.3'
	implementation 'eu.europa.ec.joinup.sd-dss:dss-utils-google-guava:6.3'
	implementation 'eu.europa.ec.joinup.sd-dss:dss-cms-object:6.3'
	implementation 'eu.europa.ec.joinup.sd-dss:dss-token:6.3'
	implementation 'eu.europa.ec.joinup.sd-dss:dss-service:6.3'
	implementation 'eu.europa.ec.joinup.sd-dss:dss-validation:6.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-web-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'be.train.demo.demo.DemoApplication'
}

tasks.named('bootJar') {
	// Nom du JAR final
	archiveFileName = 'demosignature.jar'
}
